services:
  asylum-wall:
    image: ghcr.io/khannover/asylum-wall-app:latest
    build:
      context: .
      args:
        APP_VERSION: local
    container_name: asylum-wall
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      REPO_URL: ${REPO_URL}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      GIT_USER_NAME: ${GIT_USER_NAME:-Asylum Wall Bot}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-asylum-wall@bancamp.de}
      REPO_PATH: /repo
      PORT: 8080
      EDIT_TOKEN: ${EDIT_TOKEN:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      VERIFY_MAX_PER_HOUR: ${VERIFY_MAX_PER_HOUR:-10}
    volumes:
      - asylum-repo:/repo
    # For SSH deploy key auth, uncomment and mount your key:
    # volumes:
    #   - asylum-repo:/repo
    #   - ./deploy_key:/home/asylum/.ssh/id_ed25519:ro
    # environment:
    #   REPO_URL: git@github.com:your-org/asylum-wall-ledger.git
    #   GIT_SSH_COMMAND: ssh -i /home/asylum/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new
    networks:
      - default
      - shared_net

volumes:
  asylum-repo:
networks:
  shared_net:
    name: bancamp-net
    external: true
